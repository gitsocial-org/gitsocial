version: 2

project_name: gitsocial

builds:
  - id: darwin
    main: ./cli/gitsocial
    binary: gitsocial
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin]
    goarch: [amd64, arm64]
    hooks:
      post:
        - 'scripts/bundle-darwin.sh {{ .Path }} {{ .Arch }} {{ .Version }}'
  - id: darwin-notifier
    main: ./cli/gitsocial-notifier
    binary: gitsocial-notifier
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
    goos: [darwin]
    goarch: [amd64, arm64]
    hooks:
      post:
        - 'scripts/bundle-darwin.sh {{ .Path }} {{ .Arch }} {{ .Version }}'
  - id: other
    main: ./cli/gitsocial
    binary: gitsocial
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: darwin
    ids: [darwin]
    formats: [zip]
    files:
      - src: 'dist/bundle/{{ .Arch }}/GitSocial.app'
        dst: GitSocial.app
  - id: other
    ids: [other]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  github:
    owner: gitsocial-org
    name: gitsocial
  prerelease: auto

homebrew_casks:
  - name: gitsocial
    binaries:
      - gitsocial
    custom_block: |
      app "GitSocial.app" if OS.mac?
    repository:
      owner: gitsocial-org
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_HOMEBREW_CASK_GITHUB_TOKEN }}"
    homepage: https://gitsocial.org
    description: "Git-native collaboration — posts, issues, PRs, releases, all in your repo"
    license: MIT

scoops:
  - repository:
      owner: gitsocial-org
      name: scoop-bucket
      token: "{{ .Env.GORELEASER_SCOOP_GITHUB_TOKEN }}"
    homepage: https://gitsocial.org
    description: "Git-native collaboration — posts, issues, PRs, releases, all in your repo"
    license: MIT
